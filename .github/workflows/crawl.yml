name: Crawl listings

# The real scraping home (replaces the Vercel cron). Two schedules:
#   - daily 05:00 UTC: the 4 free sources, paginated deep
#   - Mondays 04:00 UTC: Zimmo only, capped pages to fit Scrape.do's free tier
# Plus manual runs via the Actions tab (workflow_dispatch).
on:
  schedule:
    - cron: '0 5 * * *'   # daily — free sources
    - cron: '0 4 * * 1'   # weekly (Mon) — Zimmo
  workflow_dispatch:
    inputs:
      mode:
        description: Sources to crawl
        type: choice
        default: free
        options: [free, zimmo, all]
      zimmo_pages:
        description: "Zimmo pages per area (manual runs only; blank = default). Use 1 to cheaply measure Scrape.do credit cost."
        type: string
        default: ""

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22+ has a native global WebSocket; @supabase/supabase-js needs it
          # at construction time (Node 20 throws).
          node-version: '22'
          cache: npm

      - run: npm ci

      # Build the runner args: dispatch input wins (and may add --zimmo-pages);
      # otherwise the weekly cron means Zimmo and any other schedule the free sources.
      - name: Resolve args
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS="--mode ${{ github.event.inputs.mode }}"
            ZP="${{ github.event.inputs.zimmo_pages }}"
            if [ -n "$ZP" ]; then ARGS="$ARGS --zimmo-pages $ZP"; fi
          elif [ "${{ github.event.schedule }}" = "0 4 * * 1" ]; then
            ARGS="--mode zimmo"
          else
            ARGS="--mode free"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Crawl
        run: npx tsx src/scraper/run-crawler.ts ${{ steps.resolve.outputs.args }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAPBOX_SECRET_TOKEN: ${{ secrets.MAPBOX_SECRET_TOKEN }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
