name: Crawl listings

# The real scraping home (replaces the Vercel cron). Two schedules:
#   - daily 05:00 UTC: the 4 free sources, paginated deep
#   - Mondays 04:00 UTC: Zimmo only, capped pages to fit Scrape.do's free tier
# Plus manual runs via the Actions tab (workflow_dispatch).
on:
  schedule:
    - cron: '0 5 * * *'   # daily — free sources
    - cron: '0 4 * * 1'   # weekly (Mon) — Zimmo
  workflow_dispatch:
    inputs:
      mode:
        description: Sources to crawl
        type: choice
        default: free
        options: [free, zimmo, all]

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Pick the mode: dispatch input wins; otherwise the weekly cron means
      # Zimmo and any other schedule means the free sources.
      - name: Resolve mode
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 4 * * 1" ]; then
            echo "mode=zimmo" >> "$GITHUB_OUTPUT"
          else
            echo "mode=free" >> "$GITHUB_OUTPUT"
          fi

      - name: Crawl
        run: npx tsx src/scraper/run-crawler.ts --mode ${{ steps.resolve.outputs.mode }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAPBOX_SECRET_TOKEN: ${{ secrets.MAPBOX_SECRET_TOKEN }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
