name: AI Build

# Fires when an issue gets the `ready-for-agent` label and runs the /ai-build
# orchestrator (.claude/commands/ai-build.md) against it end to end: plan,
# implement, gate, review, draft PR. The label itself is the human gate — see
# docs/agents/triage-labels.md.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to run /ai-build against (manual debug trigger)
        type: string
        required: true

concurrency:
  group: ai-build-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  ai-build:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ready-for-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Run /ai-build
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "/ai-build ${{ github.event.issue.number || github.event.inputs.issue_number }}"
          show_full_output: true
